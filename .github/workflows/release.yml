name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: zelotes-f35c-linux-x86_64
          - os: macos-latest
            artifact: zelotes-f35c-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI dependencies (Linux webview)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev python3-gi python3-gi-cairo gir1.2-webkit2-4.1
      - name: Build standalone binaries
        run: |
          pip install pyinstaller pywebview
          pyinstaller --onefile --name f35c f35c.py
          pyinstaller --onefile --name f35c-gui --collect-all webview f35c_gui.py
          chmod +x dist/f35c dist/f35c-gui
          ./dist/f35c --version
          cd dist && tar czf "../${{ matrix.artifact }}.tar.gz" f35c f35c-gui
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.tar.gz
          generate_release_notes: true
